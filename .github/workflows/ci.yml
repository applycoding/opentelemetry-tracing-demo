name: ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test

  orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orders/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: payments/go.sum
      - run: go test ./...

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_configs.py
      - name: Validate collector config
        run: |
          curl -fsSL -o /tmp/otelcol.tar.gz https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.163.1/otelcol-contrib_0.163.1_linux_amd64.tar.gz
          tar -xzf /tmp/otelcol.tar.gz -C /tmp otelcol-contrib
          /tmp/otelcol-contrib validate --config=file:deploy/otel-collector.yaml
      - name: Validate compose file
        run: docker compose config >/dev/null
